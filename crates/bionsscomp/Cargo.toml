[package]
name = "bionsscomp"
description = "NWScript (.nss) to compiled script (.ncs) compiler for Star Wars: Knights of the Old Republic I and II"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "bionsscomp"
path = "src/lib.rs"

# No dependencies on purpose. The crate stays std-only so it keeps building on
# the oldest toolchain BioPatcher supports, and so consumers inherit nothing.
[dependencies]

# Test-only. kotor-ncs-isa holds the same instruction set, enumerated as
# (opcode, qualifier) pairs; tests/isa_agreement.rs checks this crate's
# vocabularies against it so the two cannot drift apart. A dev-dependency
# does not reach consumers, so they still inherit nothing.
[dev-dependencies]
kotor-ncs-isa = { git = "https://github.com/arrenkaetris/kotor-formats", tag = "v0.1.0" }
